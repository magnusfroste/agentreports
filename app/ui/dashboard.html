<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<script src="/static/theme.js?v={{v}}"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{site_title}}</title>
{{icons}}
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="stylesheet" href="/static/brand.css?v={{v}}">
</head>
<body data-page="shell">
<div class="shell">
  <aside class="side" id="side" aria-label="{{t.panel}}">
    <div class="side-head">
      <a class="brand" href="/" data-nav>{{logo_32}}<span>{{site_title}}</span></a>
      <button class="icon-btn side-hide" type="button" id="side-hide" aria-label="{{t.panel}}" title="{{t.panel}}">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <label class="side-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sq" type="search" placeholder="{{t.search}}" autocomplete="off" spellcheck="false" aria-label="{{t.search}}">
    </label>
    <nav class="side-nav" id="sidenav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <section class="view-home" id="view-home">
      <div class="home-top">
        <button class="icon-btn menu-btn" type="button" aria-label="{{t.menu_open}}"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <p class="intro"><span class="intro-sub">{{subtitle}}</span><span class="stats" id="stats"></span></p>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="{{t.search}}" autocomplete="off" spellcheck="false" aria-label="{{t.search}}">
          <kbd>/</kbd>
        </label>
        <div class="controls">
          <select id="sort" aria-label="Sort">
            <option value="updated">{{t.sort_updated}}</option>
            <option value="created">{{t.sort_created}}</option>
            <option value="title">{{t.sort_title}}</option>
            <option value="category">{{t.sort_category}}</option>
          </select>
          <div class="seg" role="group" aria-label="{{t.view_mode}}">
            <button type="button" data-view="cards" aria-label="{{t.view_cards}}" title="{{t.view_cards}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
            <button type="button" data-view="list" aria-label="{{t.view_list}}" title="{{t.view_list}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/></svg></button>
          </div>
          <label class="toggle"><input type="checkbox" id="arch"><span>{{t.show_archived}}</span></label>
        </div>
      </div>
      <nav class="chips" id="cats" aria-label="Categories"></nav>
      <div id="grid" class="grid-wrap"></div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <section class="view-report" id="view-report" hidden>
      <div class="rbar">
        <button class="icon-btn menu-btn" type="button" aria-label="{{t.menu_open}}"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="rbar-title">
          <span class="pill" id="r-pill"></span>
          <h1 id="r-title"></h1>
          <span class="rbar-meta" id="r-meta"></span>
        </div>
        <div class="rbar-actions">
          <button class="icon-btn" type="button" id="r-pin"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg></button>
          <a class="icon-btn" id="r-tab" target="_blank" rel="noopener" title="{{t.open_tab}}" aria-label="{{t.open_tab}}"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
          <a class="icon-btn" id="r-info" title="{{t.details}}" aria-label="{{t.details}}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></a>
          <button class="icon-btn" type="button" id="r-copy" title="{{t.copy_link}}" aria-label="{{t.copy_link}}"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
        </div>
      </div>
      <iframe id="frame" title="" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads allow-top-navigation-by-user-activation"></iframe>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="data">{{data}}</script>
<script src="/static/app.js?v={{v}}"></script>
</body>
</html>
