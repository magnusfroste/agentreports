<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<script src="/static/theme.js?v={{v}}"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{site_title}}</title>
{{icons}}
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="stylesheet" href="/static/brand.css?v={{v}}">
</head>
<body data-page="dashboard">
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/">{{logo_32}}<span>{{site_title}}</span></a>
    <div class="top-actions">
      <div class="theme" role="group" aria-label="{{t.theme}}">
        <button type="button" data-theme-set="system" title="{{t.theme_system}}" aria-label="{{t.theme_system}}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button type="button" data-theme-set="light" title="{{t.theme_light}}" aria-label="{{t.theme_light}}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-set="dark" title="{{t.theme_dark}}" aria-label="{{t.theme_dark}}"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <form method="post" action="/logout"><button class="btn ghost small" type="submit">{{t.logout}}</button></form>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>{{site_title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <p class="stats" id="stats"></p>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="{{t.search}}" autocomplete="off" spellcheck="false" aria-label="{{t.search}}">
      <kbd>/</kbd>
    </label>
    <div class="controls">
      <select id="sort" aria-label="Sort">
        <option value="updated">{{t.sort_updated}}</option>
        <option value="created">{{t.sort_created}}</option>
        <option value="title">{{t.sort_title}}</option>
        <option value="category">{{t.sort_category}}</option>
      </select>
      <div class="seg" role="group" aria-label="{{t.view_mode}}">
        <button type="button" data-view="cards" aria-label="{{t.view_cards}}" title="{{t.view_cards}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
        <button type="button" data-view="list" aria-label="{{t.view_list}}" title="{{t.view_list}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/></svg></button>
      </div>
      <label class="toggle"><input type="checkbox" id="arch"><span>{{t.show_archived}}</span></label>
    </div>
  </div>

  <nav class="chips" id="cats" aria-label="Categories"></nav>
  <div id="grid" class="grid-wrap"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="data">{{data}}</script>
<script src="/static/app.js?v={{v}}"></script>
</body>
</html>
